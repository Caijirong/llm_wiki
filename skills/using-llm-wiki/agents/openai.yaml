interface:
  display_name: "Knowledge Base"
  short_description: "Use wiki knowledge and import materials"
  default_prompt: "Use $using-llm-wiki to answer from existing knowledge base materials or import source files into the wiki workflow."

dependencies:
  tools:
    - type: "mcp"
      value: "llm-wiki"
      description: "Embedded LLM Wiki MCP server exposing query, upload guide, and ingest queue tools."

policy:
  allow_implicit_invocation: true

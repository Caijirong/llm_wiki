interface:
  display_name: "Knowledge Base"
  short_description: "Ground answers and drafts in wiki knowledge"
  default_prompt: "Use $using-llm-wiki for daily questions, internal standards, prior-solution reuse, document drafting, and project-specific terms. First call llm_wiki_get_context before answering or drafting; for imports, first call llm_wiki_get_upload_guide."

dependencies:
  tools:
    - type: "mcp"
      value: "llm-wiki"
      description: "Embedded LLM Wiki MCP server exposing query, upload guide, and ingest queue tools."

policy:
  allow_implicit_invocation: true
